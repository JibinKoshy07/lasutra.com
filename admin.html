<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaSutra Boutique - Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --ink: #1d1d23;
      --muted: #8b8b93;
      --bg: #faf7f4;
      --card: #ffffff;
      --border: #eee7e1;
      --accent: #e0455c;
      --accent-hover: #d13851;
      --accent-soft: #fdf1f2;
      --green: #2e7d5b;
      --green-soft: #e6f4ef;
      --amber: #b7791f;
      --amber-soft: #fdf4e3;
      --shadow: 0 1px 3px rgba(29, 29, 35, 0.06), 0 8px 24px rgba(29, 29, 35, 0.05);
      --shadow-lg: 0 24px 60px rgba(29, 29, 35, 0.12);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    /* Login Styles */
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 60% 50% at 15% 10%, #fbe8ea 0%, transparent 60%),
        radial-gradient(ellipse 55% 45% at 85% 90%, #f5ece4 0%, transparent 60%),
        var(--bg);
      transition: opacity 0.3s;
    }

    .login-box {
      background: var(--card);
      padding: 44px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-logo h1 {
      font-family: 'Playfair Display', serif;
      color: var(--accent);
      font-size: 30px;
    }

    .login-logo span {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      background: #fdfcfd;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--ink);
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #fbe4e7;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .login-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .error-msg {
      color: var(--accent);
      font-size: 13px;
      text-align: center;
      margin-top: 14px;
      min-height: 18px;
    }

    /* Admin Panel */
    .admin-container {
      display: none;
    }

    .admin-container.active {
      display: block;
    }

    .admin-header {
      background: var(--card);
      padding: 14px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);
    }

    .admin-logo {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      color: var(--ink);
    }

    .admin-logo span {
      font-family: 'DM Sans', sans-serif;
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-left: 6px;
    }

    .admin-nav {
      display: flex;
      gap: 8px;
    }

    .admin-nav button {
      padding: 9px 18px;
      background: transparent;
      border: none;
      border-radius: 999px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .admin-nav button:hover {
      color: var(--ink);
      background: var(--bg);
    }

    .admin-nav button.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .admin-nav .logout-btn {
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .admin-nav .logout-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .admin-main {
      padding: 32px 40px 64px;
      max-width: 1320px;
      margin: 0 auto;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--ink);
    }

    .search-input {
      padding: 10px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--ink);
      font-size: 14px;
      width: 240px;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #fbe4e7;
    }

    .btn-primary {
      padding: 11px 20px;
      background: var(--accent);
      border: none;
      border-radius: 999px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      white-space: nowrap;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      padding: 11px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      color: var(--ink);
      border-color: var(--muted);
    }

    .btn-icon {
      padding: 7px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-icon.danger:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card);
      padding: 22px 24px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .stat-card h3 {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .stat-card .value {
      font-family: 'Playfair Display', serif;
      font-size: 34px;
      font-weight: 600;
      color: var(--accent);
    }

    /* Tables */
    .table-wrapper {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table thead {
      background: #faf5f2;
    }

    .data-table th {
      text-align: left;
      padding: 14px 18px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .data-table td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      vertical-align: middle;
    }

    .data-table tbody tr:last-child td {
      border-bottom: none;
    }

    .data-table tbody tr:hover {
      background: #fdfbfa;
    }

    .product-thumb {
      width: 52px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      background: #f4efea;
    }

    .cat-badge {
      display: inline-block;
      padding: 5px 12px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .price-cell {
      font-weight: 700;
      color: var(--accent);
    }

    .stock-cell {
      color: var(--ink);
    }

    .stock-cell.low {
      color: var(--amber);
      font-weight: 700;
    }

    .stock-cell.zero {
      color: var(--accent);
      font-weight: 700;
    }

    .actions-cell {
      white-space: nowrap;
    }

    .actions-cell .btn-icon {
      margin-right: 6px;
    }

    /* Categories */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }

    .category-card {
      background: var(--card);
      padding: 20px 22px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cat-name {
      font-weight: 700;
      font-size: 16px;
      color: var(--ink);
    }

    .cat-count {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
    }

    /* Status badges (orders) */
    .status-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize;
    }

    .status-badge.status-pending {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .status-badge.status-in-progress {
      background: #e8f0fb;
      color: #3b6fb5;
    }

    .status-badge.status-delivered {
      background: var(--green-soft);
      color: var(--green);
    }

    .status-badge.status-cancelled {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .status-select {
      padding: 8px 10px;
      background: #fdfcfd;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--ink);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
    }

    .status-select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .order-items {
      color: var(--muted);
      font-size: 13px;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(29, 29, 35, 0.35);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--card);
      border-radius: 20px;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 28px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--ink);
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 26px;
      color: var(--muted);
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: var(--ink);
    }

    .modal-body {
      padding: 24px 28px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 18px 28px;
      border-top: 1px solid var(--border);
    }

    /* Image upload */
    .upload-box {
      border: 2px dashed #e8ded6;
      border-radius: 14px;
      background: #fdfcfa;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      overflow: hidden;
    }

    .upload-box:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .upload-hint {
      padding: 26px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .upload-hint strong {
      display: block;
      color: var(--ink);
      font-size: 14px;
      margin-bottom: 4px;
    }

    .image-preview {
      display: none;
      width: 100%;
      max-height: 220px;
      object-fit: cover;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      padding: 14px 22px;
      background: var(--ink);
      color: #fff;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      transform: translateY(10px);
      z-index: 200;
      box-shadow: var(--shadow-lg);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.error {
      background: var(--accent);
    }

    .loading, .no-data {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .admin-header {
        flex-direction: column;
        gap: 12px;
        padding: 14px 20px;
      }

      .admin-main {
        padding: 20px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
</style>
</head>
<body>
  <!-- Login Page -->
  <div class="login-container" id="loginPage">
    <div class="login-box">
      <div class="login-logo">
        <h1>LaSutra</h1>
        <span>Admin Panel</span>
      </div>
      <form id="adminLoginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="adminEmail" placeholder="Enter admin email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="adminPassword" placeholder="Enter password" required>
        </div>
        <button type="submit" class="login-btn">Login</button>
        <div class="error-msg" id="loginError"></div>
      </form>
    </div>
  </div>

  <!-- Admin Panel -->
  <div class="admin-container" id="adminPanel">
    <header class="admin-header">
      <div class="admin-logo">
        LaSutra <span>Admin Panel</span>
      </div>
      <nav class="admin-nav">
        <button class="active" data-view="products" onclick="switchView('products', this)">Products</button>
        <button data-view="categories" onclick="switchView('categories', this)">Categories</button>
        <button data-view="orders" onclick="switchView('orders', this)">Orders</button>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </nav>
    </header>

    <main class="admin-main">
      <!-- Products View -->
      <div class="view active" id="view-products">
        <div class="toolbar">
          <h2 class="section-title">Products</h2>
          <div style="display: flex; gap: 12px; align-items: center;">
            <input class="search-input" id="productSearch" placeholder="Search products..." oninput="renderProductsTable()">
            <button class="btn-primary" onclick="openProductModal()">+ Add Product</button>
          </div>
        </div>

        <div class="stats-grid" id="productStats"></div>
        <div id="productsContainer"><div class="loading">Loading products...</div></div>
      </div>

      <!-- Categories View -->
      <div class="view" id="view-categories">
        <div class="toolbar">
          <h2 class="section-title">Categories</h2>
          <button class="btn-primary" onclick="openCategoryModal()">+ Add Category</button>
        </div>
        <div id="categoriesContainer"><div class="loading">Loading categories...</div></div>
      </div>

      <!-- Orders View -->
      <div class="view" id="view-orders">
        <h2 class="section-title" style="margin-bottom: 20px;">Orders Overview</h2>

        <div class="stats-grid">
          <div class="stat-card">
            <h3>Total Orders</h3>
            <div class="value" id="totalOrders">0</div>
          </div>
          <div class="stat-card">
            <h3>Pending</h3>
            <div class="value" id="pendingOrders">0</div>
          </div>
          <div class="stat-card">
            <h3>In Progress</h3>
            <div class="value" id="inProgressOrders">0</div>
          </div>
          <div class="stat-card">
            <h3>Delivered</h3>
            <div class="value" id="deliveredOrders">0</div>
          </div>
        </div>

        <div id="ordersContainer">
          <div class="loading">Loading orders...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Product Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="productModalTitle">Add Product</h3>
        <button class="modal-close" onclick="closeProductModal()">&times;</button>
      </div>
      <form id="productForm" onsubmit="saveProduct(event)">
        <div class="modal-body">
          <div class="form-group">
            <label>Product Name *</label>
            <input type="text" id="productName" placeholder="e.g. Cotton Kurti" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Category</label>
              <select id="productCategory">
                <option value="">Uncategorized</option>
              </select>
            </div>
            <div class="form-group">
              <label>Price (₹) *</label>
              <input type="number" id="productPrice" placeholder="0.00" min="0" step="0.01" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Stock</label>
              <input type="number" id="productStock" placeholder="0" min="0">
            </div>
            <div class="form-group">
              <label>Product Image</label>
              <div class="upload-box" onclick="document.getElementById('productImageFile').click()">
                <input type="file" id="productImageFile" accept="image/*" hidden onchange="handleImageSelect(event)">
                <img class="image-preview" id="imagePreview" alt="Preview">
                <div class="upload-hint" id="uploadHint">
                  <strong>Click to upload an image</strong>
                  PNG, JPG or WebP — up to 5MB
                </div>
              </div>
              <input type="hidden" id="productImage">
            </div>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="productDescription" placeholder="Short product description..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeProductModal()">Cancel</button>
          <button type="submit" class="btn-primary">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Category Modal -->
  <div class="modal-overlay" id="categoryModal">
    <div class="modal" style="max-width: 400px;">
      <div class="modal-header">
        <h3>Add Category</h3>
        <button class="modal-close" onclick="closeCategoryModal()">&times;</button>
      </div>
      <form id="categoryForm" onsubmit="saveCategory(event)">
        <div class="modal-body">
          <div class="form-group">
            <label>Category Name *</label>
            <input type="text" id="categoryName" placeholder="e.g. Ethnic Wear" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeCategoryModal()">Cancel</button>
          <button type="submit" class="btn-primary">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    const API_URL = 'http://localhost:3000/api';

    let allProducts = [];
    let allCategories = [];
    let editingProductId = null;

    // ============ TOAST ============
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast show ${type}`;
      setTimeout(() => { toast.className = 'toast'; }, 3000);
    }

    // ============ AUTH ============
    const savedAdmin = localStorage.getItem('lasutra_admin');
    if (savedAdmin) {
      showAdminPanel();
      initDashboard();
    }

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value;
      const password = document.getElementById('adminPassword').value;
      const errorEl = document.getElementById('loginError');

      try {
        const response = await fetch(`${API_URL}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('lasutra_admin', JSON.stringify(data.admin));
          showAdminPanel();
          initDashboard();
        } else {
          errorEl.textContent = data.error || 'Login failed';
        }
      } catch (err) {
        errorEl.textContent = 'Cannot connect to server';
      }
    });

    function showAdminPanel() {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('adminPanel').classList.add('active');
    }

    function logout() {
      localStorage.removeItem('lasutra_admin');
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('adminPanel').classList.remove('active');
    }

    // ============ NAVIGATION ============
    function switchView(view, btn) {
      document.querySelectorAll('.admin-nav button[data-view]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(`view-${view}`).classList.add('active');

      if (view === 'orders') loadOrders();
      if (view === 'products') initProducts();
      if (view === 'categories') loadCategories();
    }

    function initDashboard() {
      initProducts();
      loadCategories();
    }

    // ============ PRODUCTS ============
    async function initProducts() {
      await Promise.all([loadProducts(), loadCategories()]);
    }

    async function loadProducts() {
      const container = document.getElementById('productsContainer');
      try {
        const response = await fetch(`${API_URL}/products`);
        allProducts = await response.json();
        renderProductStats();
        renderProductsTable();
        populateCategoryDropdown();
      } catch (err) {
        container.innerHTML = '<div class="no-data">Failed to load products. Is the backend running?</div>';
      }
    }

    function renderProductStats() {
      const totalStock = allProducts.reduce((sum, p) => sum + (p.stock || 0), 0);
      const lowStock = allProducts.filter(p => (p.stock || 0) > 0 && (p.stock || 0) < 5).length;
      document.getElementById('productStats').innerHTML = `
        <div class="stat-card"><h3>Total Products</h3><div class="value">${allProducts.length}</div></div>
        <div class="stat-card"><h3>Categories</h3><div class="value">${allCategories.length}</div></div>
        <div class="stat-card"><h3>Total Stock</h3><div class="value">${totalStock}</div></div>
        <div class="stat-card"><h3>Low Stock</h3><div class="value">${lowStock}</div></div>
      `;
    }

    function renderProductsTable() {
      const container = document.getElementById('productsContainer');
      const query = document.getElementById('productSearch').value.toLowerCase();
      const filtered = allProducts.filter(p =>
        p.name.toLowerCase().includes(query) ||
        (p.category || '').toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div class="no-data">${query ? 'No products match your search' : 'No products yet. Click "+ Add Product" to create one.'}</div>`;
        return;
      }

      container.innerHTML = `
        <div class="data-table">
          <table>
            <thead>
              <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${filtered.map(p => `
                <tr>
                  <td><img class="product-thumb" src="${p.image || ''}" alt="" onerror="this.style.visibility='hidden'"></td>
                  <td>
                    <strong>${p.name}</strong>
                    ${p.description ? `<div style="color:#888;font-size:12px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.description}</div>` : ''}
                  </td>
                  <td>${p.category ? `<span class="cat-badge">${p.category}</span>` : '<span style="color:#555">—</span>'}</td>
                  <td class="price-cell">₹${parseFloat(p.price).toFixed(2)}</td>
                  <td class="stock-cell ${p.stock === 0 ? 'zero' : (p.stock < 5 ? 'low' : '')}">${p.stock}</td>
                  <td class="actions-cell">
                    <button class="btn-icon" onclick="editProduct(${p.id})">Edit</button>
                    <button class="btn-icon danger" onclick="deleteProduct(${p.id}, '${p.name.replace(/'/g, "\\'")}')">Delete</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // ============ PRODUCT MODAL ============
    function openProductModal(product = null) {
      editingProductId = product ? product.id : null;
      document.getElementById('productModalTitle').textContent = product ? 'Edit Product' : 'Add Product';
      document.getElementById('productName').value = product ? product.name : '';
      document.getElementById('productCategory').value = product && product.category_id ? product.category_id : '';
      document.getElementById('productPrice').value = product ? parseFloat(product.price) : '';
      document.getElementById('productStock').value = product ? product.stock : '';
      document.getElementById('productImage').value = product && product.image ? product.image : '';
      document.getElementById('productImageFile').value = '';
      document.getElementById('productDescription').value = product && product.description ? product.description : '';
      resetImageBox(product && product.image ? product.image : null);
      document.getElementById('productModal').classList.add('open');
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.remove('open');
    }

    function resetImageBox(imageUrl) {
      const img = document.getElementById('imagePreview');
      const hint = document.getElementById('uploadHint');
      if (imageUrl) {
        img.src = imageUrl;
        img.style.display = 'block';
        hint.style.display = 'none';
      } else {
        img.style.display = 'none';
        hint.style.display = 'block';
        hint.innerHTML = '<strong>Click to upload an image</strong>PNG, JPG or WebP — up to 5MB';
      }
    }

    function handleImageSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        e.target.value = '';
        showToast('Image must be smaller than 5MB', 'error');
        return;
      }
      const img = document.getElementById('imagePreview');
      img.src = URL.createObjectURL(file);
      img.style.display = 'block';
      document.getElementById('uploadHint').style.display = 'none';
      uploadImage(file);
    }

    async function uploadImage(file) {
      const formData = new FormData();
      formData.append('image', file);
      try {
        const response = await fetch(`${API_URL}/admin/upload`, { method: 'POST', body: formData });
        const data = await response.json();
        if (response.ok) {
          document.getElementById('productImage').value = data.imageUrl;
          showToast('Image uploaded');
        } else {
          resetImageBox(null);
          showToast(data.error || 'Image upload failed', 'error');
        }
      } catch (err) {
        resetImageBox(null);
        showToast('Cannot connect to server', 'error');
      }
    }

    async function saveProduct(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('productName').value,
        categoryId: document.getElementById('productCategory').value || null,
        price: document.getElementById('productPrice').value,
        stock: document.getElementById('productStock').value || 0,
        image: document.getElementById('productImage').value || null,
        description: document.getElementById('productDescription').value || null
      };

      try {
        const url = editingProductId
          ? `${API_URL}/admin/products/${editingProductId}`
          : `${API_URL}/admin/products`;
        const method = editingProductId ? 'PUT' : 'POST';

        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok) {
          showToast(editingProductId ? 'Product updated' : 'Product created');
          closeProductModal();
          loadProducts();
        } else {
          showToast(data.error || 'Failed to save product', 'error');
        }
      } catch (err) {
        showToast('Cannot connect to server', 'error');
      }
    }

    function editProduct(id) {
      const product = allProducts.find(p => p.id === id);
      if (product) openProductModal(product);
    }

    async function deleteProduct(id, name) {
      if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
      try {
        const response = await fetch(`${API_URL}/admin/products/${id}`, { method: 'DELETE' });
        if (response.ok) {
          showToast('Product deleted');
          loadProducts();
        } else {
          showToast('Failed to delete product', 'error');
        }
      } catch (err) {
        showToast('Cannot connect to server', 'error');
      }
    }

    // ============ CATEGORIES ============
    async function loadCategories() {
      try {
        const response = await fetch(`${API_URL}/categories`);
        allCategories = await response.json();
        renderCategories();
        populateCategoryDropdown();
        renderProductStats();
      } catch (err) {
        document.getElementById('categoriesContainer').innerHTML = '<div class="no-data">Failed to load categories</div>';
      }
    }

    function renderCategories() {
      const container = document.getElementById('categoriesContainer');
      if (allCategories.length === 0) {
        container.innerHTML = '<div class="no-data">No categories yet. Click "+ Add Category" to create one.</div>';
        return;
      }

      container.innerHTML = `
        <div class="categories-grid">
          ${allCategories.map(c => `
            <div class="category-card">
              <div>
                <div class="cat-name">${c.name}</div>
                <div class="cat-count">${c.product_count} product${c.product_count === 1 ? '' : 's'}</div>
              </div>
              <button class="btn-icon danger" onclick="deleteCategory(${c.id}, '${c.name.replace(/'/g, "\\'")}')">Delete</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function populateCategoryDropdown() {
      const select = document.getElementById('productCategory');
      const current = select.value;
      select.innerHTML = '<option value="">Uncategorized</option>' +
        allCategories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      select.value = current;
    }

    function openCategoryModal() {
      document.getElementById('categoryName').value = '';
      document.getElementById('categoryModal').classList.add('open');
    }

    function closeCategoryModal() {
      document.getElementById('categoryModal').classList.remove('open');
    }

    async function saveCategory(e) {
      e.preventDefault();
      const name = document.getElementById('categoryName').value;
      try {
        const response = await fetch(`${API_URL}/admin/categories`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });

        const data = await response.json();

        if (response.ok) {
          showToast('Category created');
          closeCategoryModal();
          loadCategories();
          if (allProducts.length) loadProducts();
        } else {
          showToast(data.error || 'Failed to create category', 'error');
        }
      } catch (err) {
        showToast('Cannot connect to server', 'error');
      }
    }

    async function deleteCategory(id, name) {
      if (!confirm(`Delete category "${name}"? Products in it will become uncategorized.`)) return;
      try {
        const response = await fetch(`${API_URL}/admin/categories/${id}`, { method: 'DELETE' });
        if (response.ok) {
          showToast('Category deleted');
          loadCategories();
          loadProducts();
        } else {
          showToast('Failed to delete category', 'error');
        }
      } catch (err) {
        showToast('Cannot connect to server', 'error');
      }
    }

    // ============ ORDERS ============
    async function loadOrders() {
      const container = document.getElementById('ordersContainer');
      container.innerHTML = '<div class="loading">Loading orders...</div>';

      try {
        const response = await fetch(`${API_URL}/admin/orders`);
        const orders = await response.json();

        if (orders.length === 0) {
          container.innerHTML = '<div class="no-data">No orders yet</div>';
        }

        document.getElementById('totalOrders').textContent = orders.length;
        document.getElementById('pendingOrders').textContent = orders.filter(o => o.status === 'pending').length;
        document.getElementById('inProgressOrders').textContent = orders.filter(o => o.status === 'in_progress' || o.status === 'shipped').length;
        document.getElementById('deliveredOrders').textContent = orders.filter(o => o.status === 'delivered').length;

        if (orders.length === 0) return;

        container.innerHTML = `
          <div class="data-table">
            <table class="orders-table">
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Customer</th>
                  <th>Items</th>
                  <th>Total</th>
                  <th>Shipping</th>
                  <th>Status</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody>
                ${orders.map(order => `
                  <tr>
                    <td>#${order.id}</td>
                    <td>
                      <strong>${order.user_name}</strong><br>
                      <span style="color: #888; font-size: 12px;">${order.user_email}</span>
                    </td>
                    <td>
                      <ul class="order-items">
                        ${order.items.map(item => `
                          <li>${item.product_name} x${item.quantity} - ₹${(item.product_price * item.quantity).toFixed(2)}</li>
                        `).join('')}
                      </ul>
                    </td>
                    <td style="color: #e94560; font-weight: 600;">₹${parseFloat(order.total_amount).toFixed(2)}</td>
                    <td>
                      <div style="font-size:13px;color:#aaa;">
                        ${order.shipping_state}, ${order.shipping_country}<br>
                        ${order.shipping_pin_code}
                      </div>
                    </td>
                    <td>
                      <select class="status-select" onchange="updateStatus(${order.id}, this.value)">
                        <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                        <option value="in_progress" ${order.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
                        <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                        <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                      </select>
                      <span class="status-badge status-${order.status}">${order.status.replace('_', ' ')}</span>
                    </td>
                    <td>${new Date(order.created_at).toLocaleDateString()}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        container.innerHTML = '<div class="no-data">Failed to load orders</div>';
      }
    }

    async function updateStatus(orderId, status) {
      try {
        const response = await fetch(`${API_URL}/admin/orders/${orderId}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });

        if (response.ok) {
          showToast(`Order #${orderId} marked as ${status.replace('_', ' ')}`);
          loadOrders();
        }
      } catch (err) {
        showToast('Failed to update status', 'error');
      }
    }

    // Close modals on overlay click
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('open');
      });
    });
  </script>
</body>
</html>
